name: Build Android apps

# Every push builds both APKs (download them from the run's "Artifacts").
# A tag like v1.0.3 also publishes them on the Releases page.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [admin, engineer]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # ubuntu-latest already has the Android SDK (ANDROID_HOME); Gradle fetches any missing platform itself
      - name: Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3

      - name: Install, build the screens (Engineer) and sync
        env:
          VITE_API_URL: ${{ vars.API_URL || secrets.API_URL }}
        run: |
          npm ci
          if [ "${{ matrix.app }}" = "engineer" ]; then
            if [ -z "$VITE_API_URL" ]; then echo "::error::Set the repository variable API_URL (Settings > Secrets and variables > Actions > Variables), e.g. https://<your-api>/api/v1"; exit 1; fi
            npm run build
          fi
          npx cap sync android

      - name: Signing key (from the repository secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: APK is signed with a debug key (fine for testing, not for long-term installs)."
          fi

      - name: Build APK
        working-directory: apps/${{ matrix.app }}/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.0.{0}', github.run_number) }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/out/9jafiber-${{ matrix.app }}-$VERSION_NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: 9jafiber-${{ matrix.app }}-apk
          path: out/*.apk

      - name: Publish on Releases (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
